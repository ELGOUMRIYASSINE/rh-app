# Production stack:  docker compose -f docker-compose.prod.yml up -d --build
# Public ports: 80/443 (Caddy) only. Database, Redis and MinIO stay on the private network.
name: yghr

x-app: &app
  build: .
  image: yghr:latest
  env_file: .env
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://yghr:${POSTGRES_PASSWORD}@postgres:5432/yghr
    REDIS_URL: redis://redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    STORAGE_DRIVER: s3
    REALTIME_INTERNAL_URL: http://realtime:3001
    WEB_INTERNAL_URL: http://web:3000
    APP_URL: https://${DOMAIN}
    ADMS_PUBLIC_HOST: ${DOMAIN}
    ADMS_PUBLIC_PORT: "80"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: yghr, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: yghr, TZ: Africa/Casablanca }
    volumes: [pgdata:/var/lib/postgresql/data, ./backups:/backups]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U yghr"], interval: 5s, timeout: 3s, retries: 30 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 30 }

  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [miniodata:/data]

  minio-init:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done; mc mb -p local/yghr; exit 0"]
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }

  migrate:
    <<: *app
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://yghr:${POSTGRES_PASSWORD}@postgres:5432/yghr
      SEED_DEMO_ORG: "0"
    command: ["sh", "-c", "pnpm --filter @yghr/db exec prisma migrate deploy && pnpm db:seed"]

  web:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/web", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 30s, timeout: 5s, retries: 5, start_period: 60s }

  realtime:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/realtime", "start"]

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/worker", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data, caddyconfig:/config]
    depends_on: [web, realtime]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
