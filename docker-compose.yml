# docker compose up -d   →  http://localhost:3000  (Mailpit: http://localhost:8025, MinIO: http://localhost:9001)
name: yghr

x-app: &app
  build: .
  image: yghr:latest
  env_file: .env
  restart: unless-stopped
  environment:
    DATABASE_URL: postgresql://yghr:yghr@postgres:5432/yghr
    REDIS_URL: redis://redis:6379
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    S3_ENDPOINT: http://minio:9000
    STORAGE_DRIVER: s3
    REALTIME_INTERNAL_URL: http://realtime:3001
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: yghr, POSTGRES_PASSWORD: yghr, POSTGRES_DB: yghr, TZ: Africa/Casablanca }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U yghr"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p local/yghr; exit 0"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "pnpm --filter @yghr/db exec prisma migrate deploy && pnpm db:seed"]

  web:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/web", "start"]
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 15s, timeout: 5s, retries: 10 }

  realtime:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/realtime", "start"]
    ports: ["3001:3001"]
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 15s, timeout: 5s, retries: 10 }

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@yghr/worker", "start"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  miniodata:
